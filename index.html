<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f7f5"><title>KAI · Zahnputzzeit</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#202529;background:#f7f7f5}*{box-sizing:border-box}body{margin:0}main{max-width:570px;margin:auto;padding:16px 18px 32px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:12px 0}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 19px;background:#e5e9ea;color:#172326}button.primary{background:#173e46;color:white;font-weight:700}button:disabled{opacity:.5}button:focus-visible{outline:3px solid #e5a43b}#settingsBtn{font-size:24px;padding:8px 12px}.tabs{display:flex;gap:5px;margin:12px 0 18px}.tabs span{flex:1;text-align:center;padding:10px 2px;border-radius:9px;background:#e9ebeb;font-size:13px}.tabs .active{background:#173e46;color:white}.counter{text-align:center;color:#647074;font-size:13px;letter-spacing:2px}.stage{text-align:center;font-size:30px;margin:12px 0 0}.surface{text-align:center;color:#69757a;margin:0 0 12px}.illustration{height:min(49vh,380px);min-height:235px;display:flex;align-items:center;justify-content:center}.illustration svg{height:100%;max-width:100%}.duration{text-align:center;font-weight:700;letter-spacing:1px;font-size:14px}.remaining{text-align:center;margin:10px 0 22px;font-size:17px}.actions{display:flex;gap:10px;justify-content:center}.actions button{min-width:130px}.hidden{display:none!important}dialog{border:0;border-radius:20px;padding:24px;max-width:calc(100vw - 30px);width:400px;box-shadow:0 16px 60px #0003}dialog::backdrop{background:#0007}dialog h2{margin-top:0}.close{float:right}.pickers{display:flex;align-items:end;justify-content:center;gap:12px;margin:24px 0}label{display:flex;flex-direction:column;gap:6px;font-size:13px}select{font-size:22px;padding:10px;border-radius:10px;border:1px solid #aaa;background:white}#done{text-align:center;padding:30px 0}#done h2{font-size:32px}
</style></head><body><main><header><h1>KAI</h1><button id="settingsBtn" aria-label="Einstellungen">⚙</button></header><div class="tabs"><span id="tab0">Kauflächen</span><span id="tab1">Außenflächen</span><span id="tab2">Innenflächen</span></div><section id="training"><div class="counter" id="counter">01 / 12</div><h2 class="stage" id="stage">Oben rechts</h2><p class="surface" id="surface">Kauflächen</p><div class="illustration"><svg id="mouth" viewBox="0 0 360 300" role="img" aria-label="Schematische Zahnübersicht"><path d="M40 145 Q50 38 180 38 Q310 38 320 145" fill="none" stroke="#d6a7a7" stroke-width="30" stroke-linecap="round"/><path d="M40 165 Q50 272 180 272 Q310 272 320 165" fill="none" stroke="#d6a7a7" stroke-width="30" stroke-linecap="round"/><g id="teeth"></g></svg></div><div class="duration" id="duration">15 SEKUNDEN</div><div class="remaining">Gesamt verbleibend <strong id="remaining">3:00</strong></div><div class="actions"><button class="primary" id="start">Starten</button><button id="reset">Von vorn</button></div></section><section id="done" class="hidden"><h2>✓ Geschafft.</h2><p>Alle zwölf Abschnitte geputzt.</p><button class="primary" id="again">Noch einmal putzen</button></section></main><dialog id="settings"><button class="close" id="close" aria-label="Schließen">✕</button><h2>Einstellungen</h2><p>Wie lange möchtest du putzen?</p><div class="pickers"><label>Minuten<select id="minutes"></select></label><span style="font-size:28px;padding-bottom:9px">:</span><label>Sekunden<select id="seconds"></select></label></div><p>Die App führt dich in zwölf Abschnitten durch Kau-, Außen- und Innenflächen.</p><button class="primary" id="apply">Übernehmen</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const groups=['Kauflächen','Außenflächen','Innenflächen'];
const places=['Oben rechts','Oben links','Unten rechts','Unten links'];
const steps=groups.flatMap(group=>places.map(place=>({group,place})));
let total=Number(localStorage.getItem('kaiDuration'))||180,elapsed=0,running=false,last=0,frame=0,finished=false,wake=null,ctx=null,previousStep=-1;
function format(n){n=Math.max(0,Math.ceil(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function tone(freq=880,length=.14){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+length);o.start();o.stop(ctx.currentTime+length+.02)}catch(e){}}
function signal(){tone(1100,.1);setTimeout(()=>tone(1250,.1),200);setTimeout(()=>tone(1400,.1),400);setTimeout(()=>tone(1700,.38),600)}
function renderTeeth(index){const step=steps[index],g=$('teeth');g.replaceChildren();for(let row=0;row<2;row++)for(let side=0;side<2;side++)for(let i=0;i<5;i++){let x=180+(side?1:-1)*(20+i*27),y=(row?190:110)+(row?1:-1)*Math.sin((i+1)/6*Math.PI)*22;let active=(step.place.startsWith('Unten')?row===1:row===0)&&(step.place.endsWith('rechts')?side===0:side===1);const rect=document.createElementNS('http://www.w3.org/2000/svg','rect');rect.setAttribute('x',x-12);rect.setAttribute('y',y-14);rect.setAttribute('width',24);rect.setAttribute('height',28);rect.setAttribute('rx',9);rect.setAttribute('fill',active?'#52a9bc':'#fff');rect.setAttribute('stroke',active?'#126277':'#aab1b4');rect.setAttribute('stroke-width',active?3:1.5);g.appendChild(rect)}}
function render(){const index=Math.min(11,Math.floor(elapsed/total*12)),step=steps[index];$('training').classList.toggle('hidden',finished);$('done').classList.toggle('hidden',!finished);$('counter').textContent=String(index+1).padStart(2,'0')+' / 12';$('stage').textContent=step.place;$('surface').textContent=step.group;groups.forEach((_,i)=>$('tab'+i).classList.toggle('active',Math.floor(index/4)===i));$('duration').textContent=Math.round(total/12)+' SEKUNDEN';$('remaining').textContent=format(total-elapsed);$('start').textContent=running?'Pause':'Starten';renderTeeth(index)}
async function lock(){try{if('wakeLock'in navigator)wake=await navigator.wakeLock.request('screen')}catch(e){}}
function unlock(){try{wake?.release()}catch(e){}wake=null}
function tick(now){if(!running)return;elapsed=Math.min(total,elapsed+(now-last)/1000);last=now;const step=Math.min(11,Math.floor(elapsed/total*12));if(step!==previousStep){if(previousStep>=0)signal();previousStep=step}if(elapsed>=total){running=false;finished=true;signal();unlock()}render();if(running)frame=requestAnimationFrame(tick)}
function pause(){running=false;cancelAnimationFrame(frame);unlock();render()}
function start(){if(finished)return;if(running){pause();return}running=true;last=performance.now();previousStep=Math.floor(elapsed/total*12);tone(900,.24);lock();frame=requestAnimationFrame(tick);render()}
function reset(){pause();elapsed=0;finished=false;previousStep=-1;render()}
$('start').onclick=start;$('reset').onclick=reset;$('again').onclick=reset;
for(let i=0;i<=15;i++)$('minutes').add(new Option(String(i),String(i)));
for(let i=0;i<60;i++)$('seconds').add(new Option(String(i).padStart(2,'0'),String(i)));
$('settingsBtn').onclick=()=>{$('minutes').value=String(Math.floor(total/60));$('seconds').value=String(total%60);$('settings').showModal()};
$('close').onclick=()=>$('settings').close();
$('apply').onclick=()=>{const n=Number($('minutes').value)*60+Number($('seconds').value);if(n<12){alert('Bitte mindestens 12 Sekunden auswählen.');return}total=n;localStorage.setItem('kaiDuration',String(n));reset();$('settings').close()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running)pause();else if(!document.hidden&&running)lock()});
render();
</script></body></html>
